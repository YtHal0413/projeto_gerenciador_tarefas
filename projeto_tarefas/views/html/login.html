<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Gerenciador de Tarefas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-200 p-5 text-base text-slate-800">
  <main class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-8 shadow-lg">
    <header class="mb-6 text-center">
      <p class="text-sm text-slate-500">Acesse sua conta para organizar suas tarefas</p>
    </header>

    <% if (typeof erro !== 'undefined' && erro) { %>
      <div class="mb-5 rounded-md border border-red-300 bg-red-400 px-4 py-3 text-center text-sm text-red-800" role="alert"><%= erro %></div>
    <% } %>

    <% if (typeof sucesso !== 'undefined' && sucesso) { %>
      <div class="mb-5 rounded-md border border-green-300 bg-green-100 px-4 py-3 text-center text-sm text-green-800" role="status"><%= sucesso %></div>
    <% } %>

    <form action="/login" method="POST" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-slate-700" for="email">E-mail</label>
        <input class="w-full rounded-md border border-slate-300 px-3 py-2.5 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-200" type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-semibold text-slate-700" for="senha">Senha</label>
        <input class="w-full rounded-md border border-slate-300 px-3 py-2.5 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-200" type="password" id="senha" name="senha" required autocomplete="current-password">
      </div>

      <button class="mt-1 w-full rounded-md bg-cyan-600 px-4 py-3 font-semibold text-white transition hover:bg-cyan-700" type="submit">Entrar</button>
    </form>

    <footer class="mt-6 flex flex-col gap-3 border-t border-slate-200 pt-5 text-center text-sm">
      <p>Não tem conta? <a class="font-semibold text-blue-700 hover:underline" href="/cadastro">Cadastre-se</a></p>
    </footer>
  </main>
</body>
</html>
