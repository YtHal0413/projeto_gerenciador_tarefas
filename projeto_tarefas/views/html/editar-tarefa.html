<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar tarefa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-200 p-4 text-base text-slate-800 md:p-6">
  <header class="flex flex-wrap items-center justify-between gap-4 rounded-lg border-b border-slate-200 bg-white p-4">
    <a class="flex items-center gap-2 text-lg font-bold text-slate-800 no-underline" href="/tarefas">
      <img class="h-auto w-[70px]" src="/imagens/icon.png" alt="Logo do Gerenciador de Tarefas">
    </a>
    <div class="flex items-center gap-3">
      <strong><%= usuarioLogado.nome %></strong>
      <a href="/tarefas" class="whitespace-nowrap rounded-md bg-cyan-600 px-4 py-2 font-semibold text-white no-underline transition hover:bg-cyan-700">Voltar às tarefas</a>
    </div>
  </header>

  <main class="mx-auto my-8 w-full max-w-2xl rounded-xl border border-slate-200 bg-white p-6 shadow-lg md:p-8">
    <h1 class="mb-6 text-2xl font-bold text-slate-800">Editar tarefa</h1>
    <form action="/tarefas/<%= tarefa.id %>?_method=PUT" method="POST" class="flex flex-col gap-3">
      <label class="font-semibold text-slate-700" for="titulo">Título</label>
      <input class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200" type="text" id="titulo" name="titulo" maxlength="200" value="<%= tarefa.titulo %>" required>

      <label class="mt-2 font-semibold text-slate-700" for="descricao">Descrição</label>
      <textarea class="h-32 w-full resize-y rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200" id="descricao" name="descricao"><%= tarefa.descricao %></textarea>

      <label class="mt-2 font-semibold text-slate-700" for="prioridade">Prioridade</label>
      <select class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200" id="prioridade" name="prioridade" required>
        <option value="alta" <%= tarefa.prioridade === 'alta' ? 'selected' : '' %>>Alta</option>
        <option value="media" <%= tarefa.prioridade === 'media' ? 'selected' : '' %>>Média</option>
        <option value="baixa" <%= tarefa.prioridade === 'baixa' ? 'selected' : '' %>>Baixa</option>
      </select>

      <label class="mt-2 font-semibold text-slate-700" for="categoriaId">Categoria (opcional)</label>
      <select class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200" id="categoriaId" name="categoriaId">
        <option value="">Sem categoria</option>
        <% categorias.forEach(categoria => { %>
          <option value="<%= categoria.id %>" <%= tarefa.categoriaId === categoria.id ? 'selected' : '' %>><%= categoria.nome %></option>
        <% }) %>
      </select>

      <div class="mt-3 flex items-center gap-3">
        <button type="submit" class="rounded-md bg-cyan-600 px-4 py-2 font-semibold text-white transition hover:bg-cyan-700">Salvar alterações</button>
        <a href="/tarefas" class="rounded-md bg-slate-200 px-4 py-2 font-semibold text-slate-700 no-underline transition hover:bg-slate-300">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
