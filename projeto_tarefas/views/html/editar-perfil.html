<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar perfil - Minhas Tarefas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-200 p-4 text-base text-slate-800 md:p-6">
  <header class="flex flex-wrap items-center justify-between gap-4 rounded-lg border-b border-slate-200 bg-white p-4">
    <a class="flex items-center gap-2 text-lg font-bold text-slate-800 no-underline" href="/tarefas">
      <img class="h-auto w-[70px]" src="/imagens/icon.png" alt="Logo do Gerenciador de Tarefas">
    </a>
    <div class="flex items-center gap-3">
      <strong><%= usuarioLogado.nome %></strong>
      <a href="/tarefas" class="whitespace-nowrap rounded-md bg-cyan-600 px-4 py-2 font-semibold text-white no-underline transition hover:bg-cyan-700">Voltar às tarefas</a>
    </div>
  </header>

  <main class="mx-auto my-8 w-full max-w-2xl rounded-xl border border-slate-200 bg-white p-6 shadow-lg md:p-8">
    <h1 class="mb-6 text-2xl font-bold text-slate-800">Editar perfil</h1>

    <% if (erro) { %>
      <div class="mb-5 rounded-md border border-red-300 bg-red-100 px-4 py-3 text-sm text-red-800" role="alert"><%= erro %></div>
    <% } %>
    <% if (sucesso) { %>
      <div class="mb-5 rounded-md border border-green-300 bg-green-100 px-4 py-3 text-sm text-green-800" role="status"><%= sucesso %></div>
    <% } %>

    <form action="/usuarios/<%= usuario.id %>?_method=PUT" method="POST" class="flex flex-col gap-3">
      <label class="font-semibold text-slate-700" for="nome">Nome</label>
      <input class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-cyan-600 focus:ring-2 focus:ring-cyan-200" type="text" id="nome" name="nome" maxlength="100" value="<%= usuario.nome %>" autocomplete="name" required>

      <label class="mt-2 font-semibold text-slate-700" for="email">E-mail</label>
      <input class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-cyan-600 focus:ring-2 focus:ring-cyan-200" type="email" id="email" name="email" value="<%= usuario.email %>" autocomplete="email" required>

      <p class="mt-3 text-sm text-slate-500">Deixe os campos de senha vazios para manter sua senha atual.</p>
      <label class="font-semibold text-slate-700" for="senha">Nova senha</label>
      <input class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-cyan-600 focus:ring-2 focus:ring-cyan-200" type="password" id="senha" name="senha" minlength="6" autocomplete="new-password">

      <label class="mt-2 font-semibold text-slate-700" for="confirmarSenha">Confirmar nova senha</label>
      <input class="w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-cyan-600 focus:ring-2 focus:ring-cyan-200" type="password" id="confirmarSenha" name="confirmarSenha" minlength="6" autocomplete="new-password">

      <div class="mt-3 flex items-center gap-3">
        <button type="submit" class="rounded-md bg-cyan-600 px-4 py-2 font-semibold text-white transition hover:bg-cyan-700">Salvar alterações</button>
        <a href="/tarefas" class="rounded-md bg-slate-200 px-4 py-2 font-semibold text-slate-700 no-underline transition hover:bg-slate-300">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
